services:
  postgres:
    image: postgres:16-alpine
    container_name: petcare-postgres
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare
      POSTGRES_DB: petcare
    ports:
      - "5432:5432"
    volumes:
      - petcare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  petcare_pgdata:
